<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bali Heritage Festival</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

    <div class="login-card">
        <div class="login-header">
            <img src="logoandhome/logo.png" alt="Logo" class="login-logo">
            <h2>BALI HERITAGE FESTIVAL</h2>
            <p>Silakan login untuk mengakses sistem manajemen event</p>
        </div>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Masukkan username admin" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required>
            </div>
            <button type="submit" class="btn-dark" style="width: 100%; margin-top: 10px;">Masuk Ke Sistem</button>
        </form>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            // Simulasi login sukses, langsung lempar ke halaman home.html
            window.location.href = 'home.html';
        }
    </script>
</body>
</html>
